<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connections MTG — Magic The Oráculo</title>
<meta name="description" content="Agrupá 16 cartas de Magic en 4 grupos por su conexión oculta.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%97</text></svg>">
<link rel="stylesheet" href="theme.css">
<style>
  main { text-align:center; }
  .sub { color:var(--muted); font-size:14.5px; margin:8px auto 4px; }
  .solved { max-width:520px; margin:12px auto 0; display:grid; gap:8px; }
  .grp { border-radius:12px; padding:10px 12px; color:#1a1508; animation:pop .3s ease both; }
  .grp .gl { font-family:'Jost',sans-serif; font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .grp .gc { font-family:'Spectral',serif; font-size:14px; margin-top:2px; }
  @keyframes pop { from{opacity:0;transform:scale(.96);} to{opacity:1;transform:none;} }
  .grid { max-width:520px; margin:12px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .tile { min-height:64px; display:flex; align-items:center; justify-content:center; text-align:center;
    background:var(--ink-2); border:1px solid var(--smoke-2); border-radius:11px; padding:6px 5px; cursor:pointer;
    font-family:'Spectral',serif; font-size:12px; line-height:1.15; color:var(--parchment);
    user-select:none; transition:transform .1s, background .15s, border-color .15s; }
  .tile:hover { border-color:var(--gold-dim); }
  .tile.sel { background:var(--gold); color:#241a06; border-color:var(--gold); transform:scale(.96); }
  .tile.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .controls { display:flex; gap:10px; justify-content:center; margin:16px auto 0; flex-wrap:wrap; }
  .mistakes { display:flex; gap:7px; justify-content:center; align-items:center; margin:14px 0 0; color:var(--muted); font-family:'Jost',sans-serif; font-size:13px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--bad); box-shadow:inset 0 0 3px rgba(0,0,0,.4); }
  .dot.used { background:var(--smoke); }
  .msg { min-height:20px; color:var(--gold); font-family:'Jost',sans-serif; font-size:14px; margin:12px 0 0; }
  .foot { color:var(--faint); text-align:center; font-family:'Jost',sans-serif; font-size:13px; margin-top:24px; }
  .modepick { display:inline-flex; border:1px solid var(--smoke-2); border-radius:99px; overflow:hidden; margin-top:6px; }
  .modepick button { background:transparent; border:none; color:var(--muted); padding:7px 16px; cursor:pointer; font-family:'Jost',sans-serif; font-size:13px; }
  .modepick button.on { background:var(--gold); color:#241a06; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Volver al hub</a>
  <header class="mast">
    <div class="sigil">🔗</div>
    <h1 class="wordmark">Connections</h1>
    <p class="tagline">Agrupá las 16 cartas en 4 grupos</p>
    <div class="modepick" id="modepick"><button data-mode="daily" class="on">Del día</button><button data-mode="rand">Infinito</button></div>
  </header>
  <main>
    <div id="game" hidden>
      <p class="sub">Encontrá los 4 grupos de 4 cartas que comparten algo.</p>
      <div class="solved" id="solved"></div>
      <div class="grid" id="grid"></div>
      <p class="msg" id="msg"></p>
      <div class="mistakes" id="mistakes"></div>
      <div class="controls">
        <button class="btn" id="shuffle">Mezclar</button>
        <button class="btn" id="deselect">Deseleccionar</button>
        <button class="btn btn-primary" id="submit">Enviar</button>
      </div>
    </div>
    <div id="result" hidden></div>
    <p class="foot" id="loading">Cargando el grimorio…</p>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
let POOL=[], FAM=[], mode='daily', groups=[], cats=[], tiles=[], sel=[], solved=[], mistakes=0, over=false;
const MAX_MISTAKES=4;
const GROUP_COLORS = ['#e3b45a', '#57b368', '#4a9fd6', '#b98bd0'];

fetch('data/games.json').then(r=>r.json()).then(d=>{
  POOL=d.cards; FAM=POOL.filter(c=>c.fam);
  $('#loading').hidden=true; $('#game').hidden=false; start();
}).catch(()=>{ $('#loading').textContent='No pude cargar las cartas 😿'; });

/* seeded RNG */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function shuf(arr,rng){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

/* categories */
const COLNAME={W:'Blancas',U:'Azules',B:'Negras',R:'Rojas',G:'Verdes'};
const SUBS={Dragon:'Dragones',Elf:'Elfos',Goblin:'Goblins',Angel:'Ángeles',Zombie:'Zombis',Vampire:'Vampiros',
  Wizard:'Magos',Beast:'Bestias',Human:'Humanos',Merfolk:'Tritones',Soldier:'Soldados',Knight:'Caballeros',
  Spirit:'Espíritus',Cat:'Gatos',Bird:'Pájaros',Sliver:'Fragmentados',Demon:'Demonios',Warrior:'Guerreros',
  Hydra:'Hidras',Elemental:'Elementales',Dinosaur:'Dinosaurios',Snake:'Serpientes',Cleric:'Clérigos',Druid:'Druidas'};
const TYPES={Instant:'Instantáneos',Sorcery:'Conjuros',Enchantment:'Encantamientos',Artifact:'Artefactos',Planeswalker:'Planeswalkers',Land:'Tierras'};
function subToks(c){ return (c.st||'').split(/\s+/).filter(Boolean); }
function allCategories(){
  const L=[];
  for(const x of 'WUBRG') L.push({kind:'color', label:COLNAME[x], test:c=>c.co===x});
  L.push({kind:'color', label:'Incoloras', test:c=>c.co===''});
  L.push({kind:'color', label:'Multicolor', test:c=>c.co.length>=2});
  for(const n of [1,2,3,4,5]) L.push({kind:'cmc', label:'Coste '+n, test:c=>c.cmc===n});
  L.push({kind:'cmc', label:'Coste 6+', test:c=>c.cmc>=6});
  for(const s in SUBS) L.push({kind:'subtype', label:SUBS[s], test:c=>subToks(c).includes(s)});
  for(const t in TYPES){ const isCr=false;
    L.push({kind:'type', label:TYPES[t], test:c=> c.t.includes(t) && (t==='Land'||t==='Planeswalker'|| !c.t.includes('Creature')) }); }
  L.push({kind:'misc', label:'Legendarias', test:c=>c.t.includes('Legendary')});
  L.push({kind:'misc', label:'Míticas', test:c=>c.r==='m'});
  return L;
}

function makePuzzle(seed){
  const rng=mulberry(seed);
  let cands=allCategories().map(c=>({...c, pool:FAM.filter(c.test)})).filter(c=>c.pool.length>=6);
  const byKind={}; for(const c of cands){ (byKind[c.kind]=byKind[c.kind]||[]).push(c); }
  const kinds=Object.keys(byKind);
  for(let attempt=0; attempt<600; attempt++){
    const ks=shuf(kinds.slice(),rng).slice(0,4);
    if(ks.length<4) break;
    const chosen=ks.map(k=>byKind[k][Math.floor(rng()*byKind[k].length)]);
    const asg=assign(chosen,rng);
    if(asg) return {cats:chosen, groups:asg};
  }
  return null;
}
function assign(chosen,rng){
  const used=new Set(), gs=[];
  for(const cat of chosen){
    const others=chosen.filter(c=>c!==cat);
    let pool=cat.pool.filter(c=>!used.has(c.n) && !others.some(o=>o.test(c)));
    if(pool.length<4) return null;
    shuf(pool,rng); const pick=pool.slice(0,4); pick.forEach(c=>used.add(c.n)); gs.push(pick);
  }
  return gs;
}

function start(){
  over=false; sel=[]; solved=[]; mistakes=0;
  let seed = mode==='daily' ? hashStr('conn'+todayKey()) : Math.floor(Math.random()*1e9);
  let pz=null, tries=0;
  do { pz=makePuzzle(seed+tries*7919); tries++; } while(!pz && tries<20);
  cats=pz.cats; groups=pz.groups;
  tiles=[]; groups.forEach((g,gi)=>g.forEach(c=>tiles.push({n:c.n, g:gi})));
  shuf(tiles, mulberry(seed+1));
  $('#result').hidden=true; $('#game').hidden=false; $('#msg').textContent='';
  render();
}
function render(){
  $('#solved').innerHTML = solved.map(gi=>`<div class="grp" style="background:${GROUP_COLORS[gi]}">
    <div class="gl">${esc(cats[gi].label)}</div><div class="gc">${groups[gi].map(c=>esc(c.n)).join(' · ')}</div></div>`).join('');
  $('#grid').innerHTML = tiles.map((t,i)=>`<div class="tile${sel.includes(i)?' sel':''}" data-i="${i}">${esc(t.n)}</div>`).join('');
  $('#grid').querySelectorAll('.tile').forEach(el=>el.onclick=()=>toggle(+el.dataset.i));
  $('#mistakes').innerHTML = 'Errores: ' + Array.from({length:MAX_MISTAKES},(_,i)=>`<span class="dot${i<mistakes?' used':''}"></span>`).join('');
}
function toggle(i){ if(over) return; const k=sel.indexOf(i); if(k>=0) sel.splice(k,1); else if(sel.length<4) sel.push(i); render(); }
$('#deselect').onclick=()=>{ sel=[]; render(); };
$('#shuffle').onclick=()=>{ shuf(tiles, mulberry(Math.floor(Math.random()*1e9))); sel=[]; render(); };
$('#submit').onclick=submit;

function submit(){
  if(over||sel.length!==4) { if(sel.length!==4) flash('Elegí 4 cartas'); return; }
  const gis=sel.map(i=>tiles[i].g); const counts={}; gis.forEach(g=>counts[g]=(counts[g]||0)+1);
  const max=Math.max(...Object.values(counts));
  if(max===4){
    const gi=gis[0]; solved.push(gi);
    // remove those tiles
    const names=new Set(sel.map(i=>tiles[i].n)); tiles=tiles.filter(t=>!names.has(t.n)); sel=[];
    if(solved.length===4){ render(); return win(); }
    flash('¡Grupo!'); render();
  } else {
    mistakes++; if(max===3) flash('Te faltó una…'); else flash('No es grupo');
    sel.forEach(i=>{ const el=$(`.tile[data-i="${i}"]`); if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400);} });
    if(mistakes>=MAX_MISTAKES) return lose();
    render();
  }
}
function flash(m){ $('#msg').textContent=m; setTimeout(()=>{ if($('#msg').textContent===m) $('#msg').textContent=''; },1300); }

function endScreen(title,ecol){
  over=true; $('#game').hidden=true; $('#result').hidden=false;
  // reveal all groups
  const all=[0,1,2,3].map(gi=>`<div class="grp" style="background:${GROUP_COLORS[gi]}">
    <div class="gl">${esc(cats[gi].label)}</div><div class="gc">${groups[gi].map(c=>esc(c.n)).join(' · ')}</div></div>`).join('');
  $('#result').innerHTML=`<h2 style="font-family:'Cinzel',serif;font-weight:700;font-size:clamp(22px,6vw,30px);color:${ecol}">${title}</h2>
    <div class="solved" style="margin-top:14px">${all}</div>
    <div class="controls"><button class="btn btn-primary" onclick="location.reload()">${mode==='daily'?'Ver de nuevo':'Otro 🔀'}</button><a class="btn" href="index.html">Otros juegos</a></div>`;
}
function win(){ endScreen(mistakes===0?'¡Perfecto! 🧠':'¡Lo resolviste!','var(--good)'); }
function lose(){ endScreen('Se acabaron los intentos','var(--bad)'); }

document.querySelectorAll('#modepick button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#modepick button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.mode; if(POOL.length) start(); });
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
</script>
</body>
</html>
