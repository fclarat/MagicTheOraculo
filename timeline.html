<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline MTG — Magic The Oráculo</title>
<meta name="description" content="Ordená cartas de Magic por su año de salida, de la más vieja a la más nueva.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%97%93</text></svg>">
<link rel="stylesheet" href="theme.css">
<style>
  main { text-align:center; }
  .sub { color:var(--muted); font-size:14.5px; margin:8px auto 2px; }
  .axis { display:flex; justify-content:space-between; max-width:560px; margin:14px auto 4px; color:var(--faint);
    font-family:'Jost',sans-serif; font-size:12px; letter-spacing:.06em; }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px auto 0; max-width:600px; }
  .tl { width:104px; background:var(--ink-2); border:2px solid var(--smoke-2); border-radius:12px; overflow:hidden;
    cursor:grab; touch-action:none; transition:transform .12s, border-color .15s, opacity .15s; padding-bottom:8px; }
  .tl:hover { border-color:var(--gold-dim); }
  .tl.dim { opacity:.3; }
  .tl.ghost { cursor:grabbing; box-shadow:var(--shadow); border-color:var(--gold); }
  .tl.ok { border-color:var(--good); } .tl.no { border-color:var(--bad); }
  .tl img { width:100%; aspect-ratio:626/457; object-fit:cover; display:block; background:var(--ink); pointer-events:none; }
  .tl .nm { font-size:11px; line-height:1.15; padding:5px 5px 0; color:var(--parchment); font-family:'Spectral',serif; min-height:2.3em; }
  .tl .yr { font-family:'Jost',sans-serif; font-weight:700; font-size:13px; color:var(--gold); margin-top:3px; }
  .msg { min-height:20px; color:var(--gold); font-family:'Jost',sans-serif; font-size:14px; margin:14px 0 0; }
  .controls { display:flex; gap:10px; justify-content:center; margin:14px auto 0; flex-wrap:wrap; }
  .result-title { font-family:'Cinzel',serif; font-weight:700; font-size:clamp(22px,6vw,32px); margin:6px 0 2px; text-wrap:balance; }
  .foot { color:var(--faint); text-align:center; font-family:'Jost',sans-serif; font-size:13px; margin-top:24px; }
  .modepick { display:inline-flex; border:1px solid var(--smoke-2); border-radius:99px; overflow:hidden; margin-top:6px; }
  .modepick button { background:transparent; border:none; color:var(--muted); padding:7px 16px; cursor:pointer; font-family:'Jost',sans-serif; font-size:13px; }
  .modepick button.on { background:var(--gold); color:#241a06; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Volver al hub</a>
  <header class="mast">
    <div class="sigil">🗓️</div>
    <h1 class="wordmark">Timeline</h1>
    <p class="tagline">Ordená las cartas por año de salida</p>
    <div class="modepick" id="modepick"><button data-mode="daily" class="on">Del día</button><button data-mode="rand">Infinito</button></div>
  </header>
  <main>
    <div id="game" hidden>
      <p class="sub">Arrastrá las cartas para ordenarlas de la <b>más vieja</b> a la <b>más nueva</b>.</p>
      <div class="axis"><span>← más vieja</span><span>más nueva →</span></div>
      <div class="row" id="row"></div>
      <p class="msg" id="msg"></p>
      <div class="controls"><button class="btn btn-primary" id="check">Comprobar</button></div>
    </div>
    <div id="result" hidden></div>
    <p class="foot" id="loading">Cargando el grimorio…</p>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
let CARDS=[], order=[], mode='daily', tries=0, over=false, revealed=false, drag=null;
const N=5;

Promise.all([fetch('data/games.json?v=3').then(r=>r.json()), fetch('data/years.json?v=3').then(r=>r.json()).catch(()=>({}))])
.then(([g,years])=>{
  CARDS = g.cards.filter(c=>c.fam && years[c.n] && years[c.n].y).map(c=>({...c, yr:years[c.n].y, fid:years[c.n].id}));
  if(CARDS.length < 20){ $('#loading').textContent='Faltan datos de años (se están cargando)…'; return; }
  $('#loading').hidden=true; $('#game').hidden=false; start();
}).catch(()=>{ $('#loading').textContent='No pude cargar las cartas 😿'; });

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function imgURL(id,k){ return `https://cards.scryfall.io/${k}/front/${id[0]}/${id[1]}/${id}.jpg`; }
function shuf(a,rng){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start(){
  over=false; revealed=false; tries=0; drag=null;
  const seed = mode==='daily' ? hashStr('timeline'+todayKey()) : Math.floor(Math.random()*1e9);
  const rng=mulberry(seed);
  // pick N cards with DISTINCT years so the order is unambiguous
  const pool=shuf(CARDS.slice(),rng); const pick=[], usedYr=new Set();
  for(const c of pool){ if(!usedYr.has(c.yr)){ pick.push(c); usedYr.add(c.yr); } if(pick.length===N) break; }
  order = shuf(pick.slice(), mulberry(seed+9));   // display in scrambled order
  $('#result').hidden=true; $('#game').hidden=false; $('#msg').textContent='';
  render();
}
function render(){
  $('#row').innerHTML = order.map((c,i)=>`
    <div class="tl${drag&&drag.card===c?' dim':''}" data-i="${i}">
      <img src="${imgURL(c.fid,'art_crop')}" alt="" onerror="this.onerror=null;this.src='${imgURL(c.fid,'normal')}'">
      <div class="nm">${esc(c.n)}</div>
      <div class="yr">${revealed?c.yr:'&nbsp;'}</div>
    </div>`).join('');
  $('#row').querySelectorAll('.tl').forEach(el=>el.addEventListener('pointerdown', e=>onDown(e, +el.dataset.i)));
}
/* drag to reorder (touch + mouse) */
function onDown(e,i){
  if(over) return; e.preventDefault();
  const el=e.currentTarget, r=el.getBoundingClientRect();
  const ghost=el.cloneNode(true); ghost.classList.add('ghost');
  ghost.style.cssText += `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;margin:0;z-index:99;pointer-events:none;opacity:.92;`;
  document.body.appendChild(ghost);
  drag={ card:order[i], ghost, dx:e.clientX-r.left, dy:e.clientY-r.top };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp, {once:true});
  render();
}
function onMove(e){
  if(!drag) return;
  drag.ghost.style.left=(e.clientX-drag.dx)+'px'; drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  const u=document.elementFromPoint(e.clientX,e.clientY), tl=u&&u.closest&&u.closest('.tl');
  if(tl){ const ti=+tl.dataset.i, ci=order.indexOf(drag.card); if(ti>=0 && ti!==ci){ order.splice(ci,1); order.splice(ti,0,drag.card); render(); } }
}
function onUp(){ window.removeEventListener('pointermove', onMove); if(drag){ drag.ghost.remove(); drag=null; render(); } }
$('#check').onclick=check;
function check(){
  if(over) return; tries++;
  const sorted=order.slice().sort((a,b)=>a.yr-b.yr);
  const okFlags=order.map((c,i)=>c.yr===sorted[i].yr);
  const allOk=okFlags.every(Boolean);
  // paint
  $('#row').querySelectorAll('.tl').forEach((el,i)=>{ el.classList.remove('sel'); el.classList.toggle('ok',okFlags[i]); el.classList.toggle('no',!okFlags[i]); });
  if(allOk){ revealed=true; return win(); }
  const nok=okFlags.filter(Boolean).length;
  $('#msg').textContent = `${nok}/${N} en su lugar — seguí probando`;
  setTimeout(()=>{ $('#row').querySelectorAll('.tl').forEach(el=>el.classList.remove('ok','no')); }, 1200);
}
function win(){
  over=true;
  setTimeout(()=>{ $('#game').hidden=true; $('#result').hidden=false;
    const line = order.map(c=>`<b style="color:var(--gold)">${c.yr}</b> ${esc(c.n)}`).join(' · ');
    $('#result').innerHTML=`<h2 class="result-title" style="color:var(--good)">¡Bien ordenadas! 🗓️</h2>
      <p style="color:var(--muted)">En ${tries} intento${tries===1?'':'s'}</p>
      <p style="max-width:520px;margin:12px auto;line-height:1.9">${line}</p>
      <div class="controls"><button class="btn btn-primary" onclick="location.reload()">${mode==='daily'?'Ver de nuevo':'Otras 🔀'}</button><a class="btn" href="index.html">Otros juegos</a></div>`;
  }, 700);
}
document.querySelectorAll('#modepick button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#modepick button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.mode; if(CARDS.length) start(); });
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
</script>
</body>
</html>
